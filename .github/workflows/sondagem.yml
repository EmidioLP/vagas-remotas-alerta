# Sondagem descartavel: mede como o Glassdoor responde de DENTRO do runner.
#
# Existe porque a ProgramaThor ficou de fora do projeto exatamente aqui --
# ela funciona de IP residencial e responde 403 de IP de datacenter. Medir
# de casa nao serve para decidir o que roda no GitHub Actions.
#
# Apague este arquivo depois de decidir sobre o Glassdoor.

name: Sondagem do Glassdoor

on:
  workflow_dispatch:

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Consultar o Glassdoor com User-Agents diferentes
        run: |
          python - <<'PY'
          import re, time, urllib.error, urllib.request

          URL = ("https://www.glassdoor.com.br/Vaga/"
                 "brasil-desenvolvedor-junior-vagas-SRCH_IL.0,6_IN36_KO7,27.htm")

          AGENTES = {
              "atual do projeto": "vagas-remotas-alerta/1.0 (busca pessoal de vagas) python-requests",
              "honesto sem token de lib": "vagas-remotas-alerta/1.0 (busca pessoal de vagas; +https://github.com/EmidioLP/vagas-remotas-alerta)",
              "python-requests puro": "python-requests/2.32.3",
          }

          for nome, ua in AGENTES.items():
              pedido = urllib.request.Request(URL, headers={
                  "User-Agent": ua, "Accept-Language": "pt-BR,pt;q=0.9"})
              try:
                  with urllib.request.urlopen(pedido, timeout=30) as r:
                      corpo = r.read().decode("utf-8", "replace")
                      vagas = len(set(re.findall(r'\\"jobTitleText\\":\\"(.*?)\\"', corpo)))
                      print(f"{nome:26} -> HTTP {r.status}  {len(corpo):>7} bytes  {vagas} vagas")
              except urllib.error.HTTPError as e:
                  print(f"{nome:26} -> HTTP {e.code}  (bloqueado)")
              except Exception as e:
                  print(f"{nome:26} -> ERRO {type(e).__name__}: {e}")
              time.sleep(3)
          PY
